<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfa076"/>
      <stop offset="30%" stop-color="#eed8b7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dfc092"/>
      <stop offset="100%" stop-color="#a68453"/>
    </linearGradient>
    <pattern id="laceUnit" width="80" height="120" patternUnits="userSpaceOnUse">
      <!-- Main Ornate Arch -->
      <path d="M40,10 C20,10 0,35 0,70 C0,100 20,115 40,115 C60,115 80,100 80,70 C80,35 60,10 40,10 Z" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.85"/>
      <path d="M40,25 C28,25 15,42 15,68 C15,90 28,102 40,102 C52,102 65,90 65,68 C65,42 52,25 40,25 Z" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.9"/>
      
      <!-- Center Flower / Trefoil -->
      <circle cx="40" cy="65" r="7" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
      <circle cx="40" cy="50" r="4.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.2"/>
      <circle cx="28" cy="65" r="4.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.2"/>
      <circle cx="52" cy="65" r="4.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.2"/>
      <circle cx="40" cy="80" r="4.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.2"/>
      <circle cx="40" cy="65" r="2" fill="url(#goldGradient)"/>

      <!-- Intersecting Scallop Ribbons -->
      <path d="M0,70 Q20,40 40,70 Q60,100 80,70" fill="none" stroke="url(#goldGradient)" stroke-width="1.4" opacity="0.8"/>
      <path d="M0,30 Q40,65 80,30" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.75"/>
      
      <!-- Top Scallop Border -->
      <path d="M0,15 Q20,0 40,15 Q60,0 80,15" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>
      <circle cx="40" cy="2" r="3" fill="url(#goldGradient)"/>
      <circle cx="0" cy="2" r="3" fill="url(#goldGradient)"/>
      <circle cx="80" cy="2" r="3" fill="url(#goldGradient)"/>

      <!-- Bottom Hanging Drops / Pearls -->
      <path d="M0,105 Q40,120 80,105" fill="none" stroke="url(#goldGradient)" stroke-width="1.6"/>
      <circle cx="40" cy="115" r="3.5" fill="url(#goldGradient)"/>
      <circle cx="20" cy="110" r="2.5" fill="url(#goldGradient)"/>
      <circle cx="60" cy="110" r="2.5" fill="url(#goldGradient)"/>
      <circle cx="0" cy="105" r="2" fill="url(#goldGradient)"/>
      <circle cx="80" cy="105" r="2" fill="url(#goldGradient)"/>

      <!-- Delicate Dots / Stippling -->
      <circle cx="40" cy="36" r="1.5" fill="url(#goldGradient)"/>
      <circle cx="32" cy="44" r="1.2" fill="url(#goldGradient)"/>
      <circle cx="48" cy="44" r="1.2" fill="url(#goldGradient)"/>
      <circle cx="32" cy="86" r="1.2" fill="url(#goldGradient)"/>
      <circle cx="48" cy="86" r="1.2" fill="url(#goldGradient)"/>
    </pattern>
  </defs>

  <!-- Repeated Lace Ribbon Across 1200px Width -->
  <rect x="0" y="0" width="1200" height="120" fill="url(#laceUnit)" />
</svg>
